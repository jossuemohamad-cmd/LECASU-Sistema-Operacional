name: Deploy Automático para cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Compilar e Enviar Frontend
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 3. Instalar Dependências e Compilar Frontend (Vite)
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: 4. Enviar Arquivos Compilados para o cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /lecasuerp/frontend/
          dangerous-clean-slate: false

  deploy-backend:
    name: Sincronizar Backend Python
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: 2. Gerar ficheiro .env com credenciais seguras
        run: |
          cat > backend/.env << EOF
          PROJECT_NAME=LECASU Sistema Operacional
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          AWS_ENDPOINT_URL_S3=${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=us-east-2
          S3_BUCKET_NAME=assets
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_PROJECT_ID=${{ secrets.GOOGLE_PROJECT_ID }}
          EOF

      - name: 3. Enviar Arquivos do Backend para o cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: /lecasuerp/
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/*.pyc
